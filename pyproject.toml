[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-research-agent"
description = "Autonomous AI research agent for FinTech research using LangChain and Ollama"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Your Name", email = "your.email@example.com" }
]

keywords = [
    "ai",
    "langchain",
    "ollama",
    "agent",
    "research",
    "fintech",
]

dependencies = [
    "langchain>=1.2.9",
    "langchain-classic>=1.0.1",
    "langchain-core>=1.0.0",
    "langchain-ollama>=1.0.0",
    "langgraph>=1.0.8",
    "python-dotenv>=1.2.1",
    "pydantic>=2.12.5",
]

[project.optional-dependencies]

search = [
    "ddgs",
]

dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]

minversion = "8.0"

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

markers = [
    "integration: tests requiring external services or a running LLM",
    "slow: tests that take longer to execute",
]

addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
]

[tool.coverage.run]

omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/ai_venv/*",
]

[tool.coverage.report]

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.setuptools.packages.find]

where = ["src"]